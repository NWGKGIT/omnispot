[project]
name = "omnispot"
version = "1.0.0"
description = "Native mobile hotspot plugin for Omarchy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["lib"]

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["test"]
